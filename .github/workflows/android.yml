name: Build Honer AI Android

# Коммит в ветку android — проверочная сборка (APK в артефактах).
# Тег android-vX.Y.Z — выпуск: подписанный APK публикуется в Releases,
# оттуда его берёт автообновление приложения.
on:
  push:
    branches: [android]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/android-v}"
          else
            NAME="$(grep -oP 'appVersionName = \(project.findProperty\("versionName"\) as String\?\) \?: "\K[0-9.]+' app/build.gradle.kts)-${GITHUB_RUN_NUMBER}"
          fi
          BASE="${NAME%%-*}"
          IFS=. read -r MA MI PA <<< "$BASE"
          # 10.44.0 → 104400: номер растёт с каждой версией, как требует Android для обновления.
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Version $NAME ($CODE)"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honer-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/honer-release.jks" >> "$GITHUB_ENV"
          chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build signed release APK
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease --console=plain -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/HonerAI-$VERSION_NAME.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "out/HonerAI-$VERSION_NAME.apk" | head -3 || true
          # Админ-приложение — только в артефактах: в публичный релиз (канал автообновления) не попадает.
          mkdir -p admin-out
          cp admin/build/outputs/apk/release/admin-release.apk "admin-out/HonerAdmin-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HonerAI-android
          path: android/out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HonerAdmin-android
          path: android/admin-out/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android/app/build/reports/tests

      - name: Publish release (auto-update channel)
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          echo "versionCode: $VERSION_CODE" > "$NOTES_FILE"
          if [ -f RELEASE_NOTES.md ]; then echo "" >> "$NOTES_FILE"; cat RELEASE_NOTES.md >> "$NOTES_FILE"; fi
          gh release create "$GITHUB_REF_NAME" "out/HonerAI-$VERSION_NAME.apk" \
            --title "Honer AI для Android $VERSION_NAME" --notes-file "$NOTES_FILE"
