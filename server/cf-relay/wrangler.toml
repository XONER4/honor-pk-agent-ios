name = "honer-relay"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Куда релей пересылает запросы (сервер Honer AI на Railway).
[vars]
UPSTREAM = "https://honor-pk-agent-ios-production.up.railway.app"
# Резервный адрес ретранслятора RunPod (если в KV ещё ничего не опубликовано).
RELAY_FALLBACK = "https://213.173.105.108:27248"

# Хранилище текущего адреса ретранслятора RunPod. Ретранслятор сам публикует сюда свой адрес при
# старте, а приложение читает его — поэтому смена адреса пода (перезапуск) НЕ ломает приложение.
[[kv_namespaces]]
binding = "RELAY_KV"
id = "a5e58b8a02d84b54a4d817736e78fe59"
