# Honer Cloud relay на Fly.io. Регион ams (Amsterdam) — там же, где сервер Railway (минимум задержки).
# Имя приложения глобально уникально; при деплое подставим реальное (--name).
app = "honer-relay"
primary_region = "ams"

[build]

[env]
  UPSTREAM = "https://honor-pk-agent-ios-production.up.railway.app"

[http_service]
  internal_port = 8080
  force_https = true
  # Релей должен быть всегда включён (держит WebSocket, нет холодного старта).
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
