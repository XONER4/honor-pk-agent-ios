description: |
  Honer AI by XONER is an Android assistant with Russian and English interfaces.
  Android 7.0 or later is required. The current APK download is free.

  Features include streaming AI chat, web search with links to sources,
  photo and document attachments, microphone dictation, spoken replies through
  available Android speech services, searchable conversation history,
  pinned chats, archives, memory and custom instructions. Version 10.57.0
  can read up to eight web sources in parallel.

  Honer AI is proprietary software. Android source code is publicly available
  for inspection in the linked Android branch; no open-source license is granted.
  Public source availability is not a claim of reproducible APK builds.

  AI answers and web search require internet access. Relevant prompts and
  attachments are processed by cloud services. Optional phone actions require
  user-enabled Android Accessibility and are not required for ordinary chat.
  The app can check for APK updates. Optional minigames use virtual coins
  without real-money wagering.

  Русский: Honer AI — помощник для Android 7.0+ с потоковым чатом,
  поиском в интернете со ссылками на источники, фотографиями и документами,
  голосовым вводом, озвучиванием ответов и историей разговоров.
  Текущая загрузка APK бесплатна; лицензия проприетарная.
  Для ответов ИИ и поиска нужен интернет, запросы обрабатываются облачными
  сервисами. Дополнительные действия с телефоном включаются пользователем.

